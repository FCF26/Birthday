<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celebration & Music Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            position: relative;
        }

        /* রাতের আকাশ - চাঁদ এবং তারা */
        .moon {
            position: absolute;
            top: 40px;
            right: 50px;
            width: 80px;
            height: 80px;
            background-color: #f6f1d5;
            border-radius: 50%;
            box-shadow: 0 0 20px #f6f1d5, 0 0 40px #f6f1d5, inset -10px -5px 0 0 #dcd6b5;
            z-index: 2;
        }

        .stars-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background-color: #ffffff;
            border-radius: 50%;
            animation: twinkle var(--duration) infinite ease-in-out;
            opacity: 0.8;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* ভাসমান বেলুন */
        .balloons-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 3;
            pointer-events: none;
        }

        .balloon {
            position: absolute;
            bottom: -150px;
            opacity: 0.9;
            animation: floatUp var(--speed) linear infinite;
        }

        /* ডিম্বাকৃতির বেলুন */
        .balloon-oval {
            width: 45px;
            height: 55px;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            position: relative;
        }

        .balloon-oval::after {
            content: "";
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 4px solid transparent;
            border-right: 4px solid transparent;
            border-bottom: 8px solid inherit;
        }

        /* বেলুনের সুতো */
        .string {
            position: absolute;
            bottom: -40px;
            left: 50%;
            width: 2px;
            height: 40px;
            background: rgba(255, 255, 255, 0.5);
            transform: translateX(-50%);
        }

        /* হার্ট শেপ বেলুন */
        .balloon-heart svg {
            width: 50px;
            height: 50px;
            filter: drop-shadow(0px 3px 5px rgba(0,0,0,0.3));
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 0.9; }
            100% { transform: translateY(-120vh) rotate(15deg); opacity: 0.2; }
        }

        /* মাঝখানের কেক কনটেইনার */
        .center-container {
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 90%;
            max-width: 400px;
        }

        /* কেক ডিজাইন */
        .cake-wrapper {
            position: relative;
            width: 200px;
            height: 200px;
            display: flex;
            flex-direction: column
