<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Birthday Celebration</title>
    <!-- আকর্ষণীয় ফন্টের জন্য Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* পেশাদার লোগো স্টাইল (উপরের বাম কোণা) */
        .logo-container {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
        }

        .logo-container img {
            height: 45px;
            width: auto;
            filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.6));
            transition: transform 0.3s ease;
        }

        /* প্রফেশনাল রাতের আকাশ এবং থ্রি-ডি চাঁদ (উপরের ডান কোণা) */
        .moon {
            position: absolute;
            top: 30px;
            right: 40px;
            width: 70px;
            height: 70px;
            background: radial-gradient(circle at 30% 30%, #fefefe, #dcd6b5);
            border-radius: 50%;
            box-shadow: 0 0 25px rgba(246, 241, 213, 0.5), inset -12px -8px 15px rgba(0, 0, 0, 0.4);
            z-index: 2;
        }

        .stars-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; pointer-events: none;
        }

        .star {
            position: absolute;
            background-color: #ffffff;
            border-radius: 50%;
            animation: twinkle var(--duration) infinite ease-in-out;
            opacity: 0.8;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.3); }
        }

        /* ভাসমান বেলুন কনটেইনার */
        .balloons-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            overflow: hidden;
            z-index: 3;
            pointer-events: none;
        }

        .balloon {
            position: absolute;
            bottom: -150px;
            animation: floatUp var(--speed) linear infinite;
        }

        /* গ্লসি থ্রি-ডি ওভাল বেলুন */
        .balloon-3d {
            width: 45px;
            height: 55px;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            position: relative;
            box-shadow: inset -10px -10px 18px rgba(0, 0, 0, 0.4), 
                        inset 5px 5px 12px rgba(255, 255, 255, 0.6), 
                        0 8px 16px rgba(0,0,0,0.3);
        }

        .balloon-3d::before {
            content: "";
            position: absolute;
            top: 8px;
            left: 8px;
            width: 8px;
            height: 12px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            transform: rotate(-30deg);
            filter: blur(1px);
        }

        .balloon-3d::after {
            content: "";
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 4px solid transparent;
            border-right: 4px solid transparent;
            border-bottom: 7px solid inherit;
        }

        /* স্মুথ এসভিজি হার্ট বেলুন */
        .balloon-heart-svg {
            width: 48px;
            height: 48px;
            position: relative;
        }

        .string {
            position: absolute;
            bottom: -35px;
            left: 50%;
            width: 1px;
            height: 35px;
            background: rgba(255, 255, 255, 0.4);
            transform: translateX(-50%);
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 0.95; }
            50% { transform: translateY(-60vh) rotate(5deg); opacity: 0.8; }
            100% { transform: translateY(-130vh) rotate(-5deg); opacity: 0.1; }
        }

        /* কেক এবং টেক্সটের জন্য সেন্টার কনটেইনার */
        .center-container {
            position: absolute;
            top: 54%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 350px;
            text-align: center;
        }

        /* রেইনবো এবং ব্লিংকিং ইফেক্টসহ Happy Birthday টেক্সট */
        .birthday-text {
            font-family: 'Pacifico', cursive;
            font-size: 2.2rem;
            margin-bottom: 10px;
            letter-spacing: 1.5px;
            animation: rainbowColor 4s linear infinite, blinkEffect 1.2s ease-in-out infinite alternate;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.6));
            white-space: nowrap;
        }

        @keyframes rainbowColor {
            0% { color: #ff4d6d; }
            20% { color: #ffa500; }
            40% { color: #ffeb3b; }
            60% { color: #00f5d4; }
            80% { color: #3a86ff; }
            100% { color: #ff007f; }
        }

        @keyframes blinkEffect {
            0% { opacity: 0.3; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1.05); }
        }

        .cake-image-wrapper {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: floatCake 3s ease-in-out infinite;
        }

        .cake-image-wrapper img {
            max-width: 200px;
            width: 65%;
            height: auto;
            filter: drop-shadow(0 15px 25px rgba(0, 0, 0, 0.6));
            border-radius: 12px;
        }

        @keyframes floatCake {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* টাচ করার নির্দেশনা মেসেজ */
        .touch-overlay {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 105, 180, 0.85);
            backdrop-filter: blur(8px);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            animation: pulseBanner 1.5s infinite alternate;
            text-align: center;
            width: 90%;
            max-width: 300px;
        }

        @keyframes pulseBanner {
            0% { transform: translateX(-50%) scale(1); }
            100% { transform: translateX(-50%) scale(1.03); }
        }

        /* অডিও কন্ট্রোল বাটন */
        .audio-control {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            padding: 10px 16px;
            border-radius: 30px;
            cursor: pointer;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        @media (max-width: 600px) {
            .logo-container { top: 15px; left: 15px; }
            .logo-container img { height: 35px; }
            .moon { width: 55px; height: 55px; top: 15px; right: 20px; }
            .birthday-text { font-size: 1.7rem; }
            .cake-image-wrapper img { max-width: 160px; }
        }
    </style>
</head>
<body>

    <!-- লোগো সংযোজন -->
    <div class="logo-container">
        <img src="cop LOGO.png" alt="Logo">
    </div>

    <div class="touch-overlay" id="touchMsg">✨ স্ক্রিনে যেকোনো জায়গায় টাচ করুন! ✨</div>

    <div class="moon"></div>
    <div class="stars-container" id="starsContainer"></div>
    <div class="balloons-container" id="balloonsContainer"></div>

    <div class="center-container">
        <div class="birthday-text">Happy Birthday</div>
        <div class="cake-image-wrapper">
            <img src="Cake.png" alt="3D Birthday Cake">
        </div>
    </div>

    <audio id="bgMusic" src="Tune.mp3" loop preload="auto"></audio>

    <button class="audio-control" id="audioBtn">
        <span id="audioIcon">🔇</span> <span id="audioText">Play Music</span>
    </button>

    <script>
        // তারা তৈরির স্ক্রিপ্ট
        const starsContainer = document.getElementById('starsContainer');
        for (let i = 0; i < 70; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            const size = Math.random() * 3 + 1;
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            star.style.top = `${Math.random() * 100}%`;
            star.style.left = `${Math.random() * 100}%`;
            star.style.setProperty('--duration', `${Math.random() * 3 + 1.5}s`);
            star.style.animationDelay = `${Math.random() * 3}s`;
            starsContainer.appendChild(star);
        }

        // বেলুন তৈরির স্ক্রিপ্ট
        const balloonsContainer = document.getElementById('balloonsContainer');
        const colors = ['#ff4d6d', '#ff758c', '#3a86ff', '#8338ec', '#ffbe0b', '#00f5d4', '#fb5607'];
        
        function createBalloon() {
            const balloon = document.createElement('div');
            const isHeart = Math.random() > 0.45;
            const color = colors[Math.floor(Math.random() * colors.length)];
            const speed = Math.random() * 6 + 6;

            balloon.classList.add('balloon');
            balloon.style.left = `${Math.random() * 95}%`;
            balloon.style.setProperty('--speed', `${speed}s`);

            if (isHeart) {
                balloon.innerHTML = `
                    <div class="balloon-heart-svg">
                        <svg viewBox="0 0 32 32" fill="${color}" style="width:100%; height:100%; filter: drop-shadow(0 5px 8px rgba(0,0,0,0.4));">
                            <path d="M23.6,0c-3.4,0-6.4,2.7-7.6,5.6C14.8,2.7,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4c0,9.4,16,23.6,16,23.6s16-14.2,16-23.6C32,3.8,28.2,0,23.6,0z"/>
                        </svg>
                        <div class="string"></div>
                    </div>`;
            } else {
                balloon.classList.add('balloon-3d');
                balloon.style.backgroundColor = color;
                balloon.innerHTML = `<div class="string"></div>`;
            }

            const scale = Math.random() * 0.4 + 0.75;
            balloon.style.transform = `scale(${scale})`;
            balloonsContainer.appendChild(balloon);
            setTimeout(() => balloon.remove(), speed * 1000);
        }

        setInterval(createBalloon, 600);
        for(let i=0; i<6; i++) setTimeout(createBalloon, i * 250);

        // WebView অডিও এবং টাচ হ্যান্ডলার
        const audio = document.getElementById('bgMusic');
        const touchMsg = document.getElementById('touchMsg');
        const audioIcon = document.getElementById('audioIcon');
        const audioText = document.getElementById('audioText');
        const audioBtn = document.getElementById('audioBtn');

        let isPlaying = false;

        function triggerPlay() {
            audio.play().then(() => {
                isPlaying = true;
                audioIcon.textContent = '🎵';
                audioText.textContent = 'Playing';
                touchMsg.style.display = 'none';
            }).catch(e => {
                console.log("Waiting for touch interaction.");
            });
        }

        window.addEventListener('click', () => { if (!isPlaying) triggerPlay(); });
        window.addEventListener('touchstart', () => { if (!isPlaying) triggerPlay(); });

        audioBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (audio.paused) {
                audio.play();
                audioIcon.textContent = '🎵';
                audioText.textContent = 'Playing';
                touchMsg.style.display = 'none';
                isPlaying = true;
            } else {
                audio.pause();
                audioIcon.textContent = '🔇';
                audioText.textContent = 'Paused';
                isPlaying = false;
            }
        });
    </script>
</body>
</html>
