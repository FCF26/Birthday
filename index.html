<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Celebration & Music Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            position: relative;
            perspective: 1000px;
        }

        /* 3D Moon */
        .moon {
            position: absolute;
            top: 40px;
            right: 50px;
            width: 80px;
            height: 80px;
            background: radial-gradient(circle at 30% 30%, #fefefe, #dcd6b5);
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(246, 241, 213, 0.6), inset -15px -10px 20px rgba(0, 0, 0, 0.4);
            z-index: 2;
        }

        .stars-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; pointer-events: none;
        }

        .star {
            position: absolute;
            background-color: #ffffff;
            border-radius: 50%;
            animation: twinkle var(--duration) infinite ease-in-out;
            opacity: 0.8;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.3); }
        }

        /* 3D Balloons Container */
        .balloons-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            overflow: hidden;
            z-index: 3;
            pointer-events: none;
        }

        .balloon {
            position: absolute;
            bottom: -180px;
            animation: floatUp var(--speed) linear infinite;
            transform-style: preserve-3d;
        }

        /* 3D Spherical Balloon with Glossy Highlight */
        .balloon-3d {
            width: 55px;
            height: 65px;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            position: relative;
            box-shadow: inset -10px -10px 20px rgba(0, 0, 0, 0.35), 
                        inset 5px 5px 15px rgba(255, 255, 255, 0.6), 
                        0 10px 20px rgba(0,0,0,0.3);
        }

        /* Glossy shine spot on balloon */
        .balloon-3d::before {
            content: "";
            position: absolute;
            top: 10px;
            left: 10px;
            width: 12px;
            height: 18px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            transform: rotate(-30deg);
            filter: blur(1px);
        }

        .balloon-3d::after {
            content: "";
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 5px solid transparent;
            border-right: 5px solid transparent;
            border-bottom: 9px solid inherit;
        }

        /* 3D Heart Balloon */
        .balloon-heart-3d svg {
            width: 60px;
            height: 60px;
            filter: drop-shadow(0px 8px 12px rgba(0,0,0,0.4));
        }

        .string {
            position: absolute;
            bottom: -45px;
            left: 50%;
            width: 1.5px;
            height: 45px;
            background: rgba(255, 255, 255, 0.4);
            transform: translateX(-50%);
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotateZ(0deg) translateZ(0px); opacity: 0.95; }
            50% { transform: translateY(-60vh) rotateZ(8deg) translateZ(30px); opacity: 0.8; }
            100% { transform: translateY(-130vh) rotateZ(-8deg) translateZ(60px); opacity: 0.1; }
        }

        /* Center 3D Cake Container */
        .center-container {
            position: absolute;
            top: 54%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 90%;
            max-width: 400px;
            transform-style: preserve-3d;
        }

        /* 3D Realistic Cake Structure */
        .cake-wrapper {
            position: relative;
            width: 220px;
            height: 220px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            transform: rotateX(15deg) rotateY(-10deg);
            transform-style: preserve-3d;
        }

        /* 3D Candle */
        .candle {
            position: absolute;
            top: 15px;
            width: 14px;
            height: 50px;
            background: repeating-linear-gradient(45deg, #ff758c, #ff758c 8px, #fff 8px, #fff 16px);
            border-radius: 4px;
            z-index: 6;
            box-shadow: 2px 5px 10px rgba(0,0,0,0.4), inset -2px 0 4px rgba(0,0,0,0.3);
            transform: translateZ(30px);
        }

        .wick {
            position: absolute;
            top: -7px;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 7px;
            background-color: #222;
        }

        .flame {
            position: absolute;
            top: -28px;
            left: 50%;
            transform: translateX(-50%);
            width: 16px;
            height: 24px;
            background: radial-gradient(ellipse at bottom, #fff 0%, #ffee55 40%, #ff6600 80%, transparent 100%);
            border-radius: 50% 50% 20% 20%;
            box-shadow: 0 0 20px #ff9900, 0 0 40px #ffee55, 0 0 60px #ff3300;
            animation: flicker 0.12s infinite alternate ease-in-out;
            transform-origin: bottom center;
        }

        @keyframes flicker {
            0% { transform: translateX(-50%) scale(1) rotate(-3deg); }
            100% { transform: translateX(-50%) scale(1.12) rotate(3deg); }
        }

        /* 3D Cake Layers with Cylindrical Depth */
        .cake-layer {
            border-radius: 50%;
            position: relative;
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.4), inset 0 8px 15px rgba(255, 255, 255, 0.4), inset 0 -10px 15px rgba(0, 0, 0, 0.3);
            transform-style: preserve-3d;
        }

        .layer-top {
            width: 130px;
            height: 38px;
            background: radial-gradient(circle at 50% 40%, #ffc0cb, #ff9bb3);
            transform: translateZ(25px);
            z-index: 5;
        }

        .layer-middle {
            width: 170px;
            height: 45px;
            background: radial-gradient(circle at 50% 40%, #ffeaa7, #fdcb6e);
            margin-top: -12px;
            transform: translateZ(15px);
            z-index: 4;
        }

        .layer-bottom {
            width: 210px;
            height: 52px;
            background: radial-gradient(circle at 50% 40%, #81ecec, #00cec9);
            margin-top: -14px;
            transform: translateZ(5px);
            z-index: 3;
        }

        /* Drip Icing for 3D look */
        .icing-drip {
            position: absolute;
            top: 0; left: 15%; right: 15%;
            height: 16px;
            background: #fff;
            border-radius: 0 0 10px 10px;
            opacity: 0.95;
            box-shadow: 0 3px 5px rgba(0,0,0,0.15);
        }

        .plate {
            width: 245px;
            height: 22px;
            background: radial-gradient(circle at 50% 50%, #ffffff, #dfe6e9);
            border-radius: 50%;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), inset 0 3px 8px rgba(0,0,0,0.2);
            margin-top: -10px;
            transform: translateZ(0px);
            z-index: 2;
        }

        /* Touch Overlay Notification */
        .touch-overlay {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 105, 180, 0.85);
            backdrop-filter: blur(8px);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            animation: pulseBanner 1.5s infinite alternate;
            text-align: center;
            width: 90%;
            max-width: 320px;
        }

        @keyframes pulseBanner {
            0% { transform: translateX(-50%) scale(1); }
            100% { transform: translateX(-50%) scale(1.03); }
        }

        /* Audio Control Button */
        .audio-control {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            padding: 10px 16px;
            border-radius: 30px;
            cursor: pointer;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        @media (max-width: 600px) {
            .moon { width: 60px; height: 60px; top: 20px; right: 20px; }
            .cake-wrapper { transform: scale(0.8) rotateX(15deg) rotateY(-10deg); }
        }
    </style>
</head>
<body>

    <div class="touch-overlay" id="touchMsg">✨ গান বাজাতে স্ক্রিনে যেকোনো জায়গায় টাচ করুন! ✨</div>

    <div class="moon"></div>
    <div class="stars-container" id="starsContainer"></div>
    <div class="balloons-container" id="balloonsContainer"></div>

    <div class="center-container">
        <div class="cake-wrapper">
            <div class="candle">
                <div class="wick"></div>
                <div class="flame"></div>
            </div>
            <div class="cake-layer layer-top"><div class="icing-drip"></div></div>
            <div class="cake-layer layer-middle"></div>
            <div class="cake-layer layer-bottom"></div>
            <div class="plate"></div>
        </div>
    </div>

    <audio id="bgMusic" src="Tune.mp3" loop preload="auto"></audio>

    <button class="audio-control" id="audioBtn">
        <span id="audioIcon">🔇</span> <span id="audioText">Play Music</span>
    </button>

    <script>
        // 3D Stars
        const starsContainer = document.getElementById('starsContainer');
        for (let i = 0; i < 75; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            const size = Math.random() * 3 + 1;
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            star.style.top = `${Math.random() * 100}%`;
            star.style.left = `${Math.random() * 100}%`;
            star.style.setProperty('--duration', `${Math.random() * 3 + 1.5}s`);
            star.style.animationDelay = `${Math.random() * 3}s`;
            starsContainer.appendChild(star);
        }

        // 3D Glossy Balloons & Hearts
        const balloonsContainer = document.getElementById('balloonsContainer');
        const colors = ['#ff4d6d', '#ff758c', '#3a86ff', '#8338ec', '#ffbe0b', '#00f5d4', '#fb5607'];
        
        function createBalloon() {
            const balloon = document.createElement('div');
            const isHeart = Math.random() > 0.45;
            const color = colors[Math.floor(Math.random() * colors.length)];
            const speed = Math.random() * 6 + 6;

            balloon.classList.add('balloon');
            balloon.style.left = `${Math.random() * 95}%`;
            balloon.style.setProperty('--speed', `${speed}s`);

            if (isHeart) {
                balloon.classList.add('balloon-heart-3d');
                balloon.innerHTML = `
                    <svg viewBox="0 0 32 32" fill="${color}">
                        <path d="M23.6,0c-3.4,0-6.4,2.7-7.6,5.6C14.8,2.7,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4c0,9.4,16,23.6,16,23.6s16-14.2,16-23.6C32,3.8,28.2,0,23.6,0z"/>
                    </svg>
                    <div class="string"></div>`;
            } else {
                balloon.classList.add('balloon-3d');
                balloon.style.backgroundColor = color;
                balloon.innerHTML = `<div class="string"></div>`;
            }

            const scale = Math.random() * 0.4 + 0.8;
            balloon.style.transform = `scale(${scale})`;
            balloonsContainer.appendChild(balloon);
            setTimeout(() => balloon.remove(), speed * 1000);
        }

        setInterval(createBalloon, 600);
        for(let i=0; i<7; i++) setTimeout(createBalloon, i * 250);

        // WebView Audio & Interaction Handler
        const audio = document.getElementById('bgMusic');
        const touchMsg = document.getElementById('touchMsg');
        const audioIcon = document.getElementById('audioIcon');
        const audioText = document.getElementById('audioText');
        const audioBtn = document.getElementById('audioBtn');

        let isPlaying = false;

        function triggerPlay() {
            audio.play().then(() => {
                isPlaying = true;
                audioIcon.textContent = '🎵';
                audioText.textContent = 'Playing';
                touchMsg.style.display = 'none';
            }).catch(e => {
                console.log("Waiting for user touch.");
            });
        }

        window.addEventListener('click', triggerPlay);
        window.addEventListener('touchstart', triggerPlay);

        audioBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (audio.paused) {
                audio.play();
                audioIcon.textContent = '🎵';
                audioText.textContent = 'Playing';
                touchMsg.style.display = 'none';
                isPlaying = true;
            } else {
                audio.pause();
                audioIcon.textContent = '🔇';
                audioText.textContent = 'Paused';
                isPlaying = false;
            }
        });
    </script>
</body>
</html>
